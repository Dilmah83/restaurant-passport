name: Native Restaurant Passport
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: passport-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix server
  iphone:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select installed iPhone
        run: |
          xcrun simctl list devices available -j > /tmp/phones.json
          python3 - <<'PY'
          import json,os
          phone=next(d for ds in json.load(open('/tmp/phones.json'))['devices'].values() for d in ds if d['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PHONE='+phone['udid']+'\n')
          PY
      - name: Build and test
        run: xcodebuild -project ios/Passport.xcodeproj -scheme Passport -destination "platform=iOS Simulator,id=$PHONE" -derivedDataPath NativeBuild -resultBundlePath NativeResults CODE_SIGNING_ALLOWED=NO test
      - name: Capture native home screen
        run: |
          xcrun simctl boot "$PHONE" || true
          xcrun simctl bootstatus "$PHONE" -b
          xcrun simctl status_bar "$PHONE" override --time "9:41" --batteryState charged --batteryLevel 100
          xcrun simctl install "$PHONE" NativeBuild/Build/Products/Debug-iphonesimulator/Passport.app
          xcrun simctl launch "$PHONE" au.restaurantpassport.tracker
          sleep 3
          xcrun simctl io "$PHONE" screenshot native-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-results-and-preview
          path: |
            NativeResults.xcresult
            native-home.png
